drone_tracker_node:
  ros__parameters:
    use_history_timestamp: false
    enable_preview: true          # 实机启动即预览；视频文件等待 ON，不提前消费
    publish_prediction: false     # bbox/LOS 使用采集时刻；true 可按新鲜云台姿态外推
    los:
      rate_filter_tau: 0.12       # 秒，0 = 不滤波
    tracker:
      yolo_engine: "balloon_int8.engine"
      nano_backbone: "nanotrackv3_backbone_int8.engine"
      nano_head: "nanotrack_head_int8.engine"
      # 目标类别：接受 cid >= yolo_target_class_id
      yolo_target_class_id: 0
      # 检测器阈值保持实机调参值；其余为 hybrid tracker 算法行为参数，
      # 与 airsim_tracker launch.py 对齐（语义已随移植改变）
      yolo_conf_threshold: 0.4
      yolo_nms_threshold: 0.45
      yolo_interval: 3
      yolo_recall_relax_ratio: 0.8   # 1.0 = 关闭（Python 端无此放宽机制）
      iou_reset_threshold: 0.4       # IoU 低于此值时重置跟踪器
      iou_calibrate_threshold: 0.8   # IoU 高于此值时视为 YOLO 确认，不干预
      max_position_jump: 150.0       # 像素（绝对值；原 1536x960 调参，960x960 下可适当调小）
      max_size_jump_ratio: 2.0
      max_box_area_ratio: 0.8
      tracking_roi_scale_factor: 2.0
      lost_max_count: 5              # 连续未确认判定上限：无检测 / 低IoU重初始化 / 未确认跳变均计数，
                                     # x yolo_interval ≈ 15 帧 (~0.3s@50fps)；持续误检不会再无限重初始化
      frame_buffer_size: 30
      jump_tolerance: 3
      enable_dcf: false               # DCF 融合开关（A/B 对比用）；false 时由 kf_r_pos/kf_q_a
                                     # 驱动的中心平滑 KF 承担稳心角色
      dcf_fixed_template: true
      dcf_learning_rate: 0.01
      dcf_lambda: 0.0001
      dcf_psr_thresh: 5.0
      dcf_max_div_factor: 0.5        # 中心发散重锚定门限（DCF 与 KF 路径共用）
      # KF 噪声（旋转补偿回溯卡尔曼滤波；r_pos/q_a 同时用于 enable_dcf=false 时的
      # 跟踪器内中心平滑 KF）
      kf_r_pos: 4.0
      kf_r_size: 4.0
      kf_q_a: 50000.0
      kf_q_size: 1000.0
    mv_camera:
      # settings for MV-IMX264M
      #   flip: true
      #   mirror: true
      #   fps: 30
      #   output_width_px: 640
      #   output_height_px: 640
      #   # native parameters for camera
      #   width_px: 1920
      #   height_px: 1920
      #   focal_length_mm: 12.0
      #   pixel_size_um: 3.45

      # settings for MV-IMX265M
      flip: false
      mirror: false
      fps: 50
      output_width_px: 960
      output_height_px: 960
      # native parameters for camera
      width_px: 1520
      height_px: 1520
      focal_length_mm: 6.0
      pixel_size_um: 3.45
